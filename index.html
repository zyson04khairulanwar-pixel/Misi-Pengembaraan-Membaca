 };

 else {example=`<div class="word-display">${d.example.word}</div><div class="example-label">Baca dahulu, kemudian cari gambar</div><div style="display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap"><div class="picture-card small">${art('BAJU')}</div><div class="picture-card small" style="border:3px solid #67d2a6">${art('TOPI')}</div><div class="picture-card small">${art('DADU')}</div></div><div class="example-label">Contoh sahaja — gambar jawapan akan dirawakkan</div>`;}

 const content=`<section class="panel"><div class="section-head"><div><div class="kicker">Panduan sebelum bermain • Peringkat ${level} daripada 3</div><h2>Cara Bermain ${level}: ${title}</h2><p>${d.subtitle} Baca langkah berikut atau gunakan butang main/jeda untuk mendengar panduan.</p></div><div class="level-badge">⏱️ 10 minit</div></div><div class="instruction-grid"><div class="steps">${steps}</div><div class="example-box">${example}<p style="font-size:12px;line-height:1.5;color:#66708c;margin:0">Gunakan gambar sebagai petunjuk. Cuba dahulu, kemudian semak jawapan.</p></div></div><div class="problem-solving-strip"><div><h3>🧠 Misi penyelesaian masalah</h3><p>${d.problem}</p></div><div class="problem-solving-steps"><div class="problem-solving-step"><b>1</b> Kenal pasti</div><div class="problem-solving-step"><b>2</b> Cari petunjuk</div><div class="problem-solving-step"><b>3</b> Cuba strategi</div><div class="problem-solving-step"><b>4</b> Semak dan baiki</div></div></div><div class="guide-actions guide-player">${guidePlaybackButton(level)}<button class="primary-btn" data-action="beginLevel" data-level="${level}">MULA PERMAINAN ${level} ▶</button>${level===1?`<button class="small-btn" data-action="backCover">← Menu Utama</button>`:''}</div><div class="notice" style="margin-top:15px">Tidak mengapa jika tersalah. Kenal pasti petunjuk, cuba cara lain dan semak semula. Suara permainan akan menyebut setiap suku kata apabila kamu meletakkannya.</div></section>`;

function shuffled(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function normalizedVoiceLang(v){return String(v&&v.lang||'').toLowerCase().replace(/_/g,'-');}
function localeGroup(v){const lang=normalizedVoiceLang(v);if(lang==='ms-my'||lang.startsWith('ms-my-'))return 'ms';if(lang==='id-id'||lang.startsWith('id-id-'))return 'id';return '';}
// Pilihan terhad kepada suara Bahasa Malaysia (ms-MY) dan Bahasa Indonesia (id-ID).
function isAllowedVoice(v){return Boolean(localeGroup(v));}
function voiceGender(v){
 const n=String(v&&v.name||'').toLowerCase();
 if(/\b(female|woman|girl)\b|jenny|aria|yasmin|suria|siti|intan|aisyah|ain(a|ah)|nabila|farah|sarah|sofia|aly(a|ah)|amira|nur|mimi|putri|melati|dewi/.test(n))return 'female';
 if(/\b(male|man|boy)\b|guy|christopher|rizwan|osman|ahmad|azlan|hamdan|hafiz|amir|izwan|hazim|faiz|hakim|iskandar|firdaus|rahman|adam|arif|syafiq|danish/.test(n))return 'male';
 return 'unknown';
}
function voiceQualityScore(v){
 const n=String(v&&v.name||'').toLowerCase();let score=0;
 if(/natural|neural/.test(n))score+=100;
 if(/online|premium/.test(n))score+=35;
 if(/standard/.test(n))score+=5;
 if(v&&v.localService)score+=4;
 if(localeGroup(v)==='ms')score+=10;
 return score;
}
function orderVoiceCandidates(list){return [...list].sort((a,b)=>voiceQualityScore(b)-voiceQualityScore(a));}
function getSupportedVoiceChoices(all){
 const allowed=orderVoiceCandidates((all||[]).filter(isAllowedVoice));
 if(!allowed.length)return [];
 // Gunakan hanya satu suara. Utamakan Bahasa Malaysia; gunakan Bahasa Indonesia jika ms-MY tiada.
 const malaysian=orderVoiceCandidates(allowed.filter(v=>localeGroup(v)==='ms'));
 const indonesian=orderVoiceCandidates(allowed.filter(v=>localeGroup(v)==='id'));
 const pool=malaysian.length?malaysian:indonesian;
 return pool.length?[pool[0]]:[];
}
function preferredVoice(list){return list[0]||null;}
function chosenVoice(){return state.voices.find(v=>v.voiceURI===state.voiceURI)||preferredVoice(state.voices);}
function chosenVoiceLabel(){const index=state.voices.findIndex(v=>v.voiceURI===state.voiceURI);return index>=0?`Bahasa ${index+1}`:(state.voices.length?'Bahasa 1':'Tidak tersedia');}
function voiceStatusNote(){
 if(state.voices.length)return '🔊 Suara bacaan dipilih secara automatik. Gunakan butang panduan untuk mendengar arahan dan butang audio untuk mendengar suku kata serta perkataan.';
 return '🔊 Suara sintesis tidak tersedia pada masa ini. Aktifkan atau pasang suara Bahasa Malaysia atau Bahasa Indonesia pada tetapan suara peranti, kemudian buka semula permainan.';
}
function loadVoices(){
 if(!('speechSynthesis' in window)){state.voices=[];state.voiceURI='';state.voiceStatus='Text-to-Speech tidak disokong oleh pelayar ini.';return;}
 const got=window.speechSynthesis.getVoices()||[];
 const choices=getSupportedVoiceChoices(got);
 const previous=state.voiceURI;
 state.voices=choices;
 if(!choices.some(v=>v.voiceURI===previous))state.voiceURI=(preferredVoice(choices)||{}).voiceURI||'';
 state.voiceStatus=choices.length?'Suara yang sesuai tersedia.':'Tiada suara yang sesuai tersedia.';
}

 if(!btn)return;

 const active=state.guideIsSpeaking&&state.guidePlaybackLevel===level;
 btn.textContent=active?(state.guidePaused?'▶ SAMBUNG PANDUAN':'⏸ JEDA PANDUAN'):'▶ DENGAR CARA BERMAIN';

function stopSpeechPlayback(){
 state.speechToken++;
 if('speechSynthesis' in window)window.speechSynthesis.cancel();
 state.isSpeaking=false;state.guideIsSpeaking=false;state.guidePaused=false;state.guidePlaybackLevel=null;
 duckMusic(false);updateGuidePlaybackButton();
}
function speakSequence(parts, opts={}){
 if(!('speechSynthesis' in window)){state.voiceStatus='Pelayar ini tidak menyokong suara sintesis.';const notice=document.querySelector('.voice-status');if(notice)notice.textContent='Suara sintesis tidak disokong oleh pelayar ini. Cuba gunakan Microsoft Edge atau Google Chrome.';return;}
 loadVoices();
 const voice=chosenVoice();
 if(!voice){state.voiceStatus='Tiada suara sintesis Bahasa Malaysia atau Bahasa Indonesia tersedia.';const notice=document.querySelector('.voice-status');if(notice)notice.textContent=voiceStatusNote();updateGuidePlaybackButton();return;}
 const token=++state.speechToken;
 window.speechSynthesis.cancel();
 const list=Array.isArray(parts)?parts:[parts];
 if(!list.length)return;
 const guideLevel=Number.isInteger(opts.guideLevel)?opts.guideLevel:null;
 state.isSpeaking=true;state.guideIsSpeaking=guideLevel!==null;state.guidePaused=false;state.guidePlaybackLevel=guideLevel;duckMusic(true);updateGuidePlaybackButton();
 let ended=0;
 list.forEach((txt)=>{
   const u=new SpeechSynthesisUtterance(String(txt));
   u.voice=voice;u.lang=(voice&&voice.lang)||'ms-MY';u.rate=Math.max(.55,Math.min(1.3,(opts.rate||state.rate)));u.pitch=1.04;u.volume=1;
   const finish=()=>{
     if(token!==state.speechToken)return;
     ended++;
     if(ended===list.length){state.isSpeaking=false;if(guideLevel!==null){state.guideIsSpeaking=false;state.guidePaused=false;state.guidePlaybackLevel=null;}duckMusic(false);updateGuidePlaybackButton();}
   };
   u.onend=finish;u.onerror=finish;window.speechSynthesis.speak(u);
 });
}
function speakGuide(level){

 const lines=[`Cara bermain ${level}. ${TITLES[level-1]}.`,...d.steps.map(s=>`${s[1]} ${s[2]}`),`Strategi penyelesaian masalah. Kenal pasti masalah, cari petunjuk, cuba strategi, kemudian semak dan baiki jawapan.`];
 speakSequence(lines,{guideLevel:level,rate:state.rate});
}
function toggleGuidePlayback(level){
 if(!('speechSynthesis' in window)){const notice=document.querySelector('.voice-status');if(notice)notice.textContent='Suara sintesis tidak disokong oleh pelayar ini. Cuba gunakan Microsoft Edge atau Google Chrome.';return;}
 if(state.guideIsSpeaking&&state.guidePlaybackLevel===level){
   if(state.guidePaused||window.speechSynthesis.paused){window.speechSynthesis.resume();state.guidePaused=false;state.isSpeaking=true;duckMusic(true);}
   else{window.speechSynthesis.pause();state.guidePaused=true;state.isSpeaking=false;duckMusic(false);}
   updateGuidePlaybackButton();return;
 }
 speakGuide(level);
}

function initAudio(){
 if(!state.audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;state.audioCtx=new AC();state.musicGain=state.audioCtx.createGain();state.musicGain.gain.value=state.musicOn?state.musicVolume:0;state.musicGain.connect(state.audioCtx.destination);}
 if(state.audioCtx.state==='suspended'){try{const resumed=state.audioCtx.resume();if(resumed&&typeof resumed.catch==='function')resumed.catch(()=>{});}catch(_e){}}
}
function tone(freq,duration,gainVal=0.06,wave='sine',when){
 if(!state.audioCtx||!state.musicGain)return;const ctx=state.audioCtx;const osc=ctx.createOscillator(),g=ctx.createGain();osc.type=wave;osc.frequency.setValueAtTime(freq,when||ctx.currentTime);g.gain.setValueAtTime(0.0001,when||ctx.currentTime);g.gain.exponentialRampToValueAtTime(gainVal, (when||ctx.currentTime)+.025);g.gain.exponentialRampToValueAtTime(0.0001,(when||ctx.currentTime)+duration);osc.connect(g);g.connect(state.musicGain);osc.start(when||ctx.currentTime);osc.stop((when||ctx.currentTime)+duration+.03);
}
function startMusic(){
 if(!state.musicOn)return;initAudio();if(!state.audioCtx||state.musicTimer)return;state.musicStarted=true;
 const melody=[523.25,659.25,783.99,659.25,587.33,698.46,880,698.46,523.25,659.25,783.99,987.77,880,783.99,659.25,587.33];
 const bass=[261.63,0,329.63,0,293.66,0,349.23,0];
 state.musicTimer=setInterval(()=>{if(!state.musicOn||!state.audioCtx||state.audioCtx.state!=='running')return;const t=state.audioCtx.currentTime;const f=melody[state.musicStep%melody.length];if(state.musicGain.gain.value>.025){tone(f,.22,.08,'triangle',t);if(state.musicStep%2===0)tone(bass[state.musicStep%bass.length]||196,.33,.045,'sine',t);}state.musicStep++;},270);
}
function unlockAudioAndKeepMusic(){
 // Cuba mainkan muzik ketika halaman dibuka; jika pelayar menyekat autoplay,
 // interaksi pertama pengguna akan membuka kunci audio dan muzik terus berjalan.

 if(state.audioCtx&&state.audioCtx.state==='suspended'){
   try{const p=state.audioCtx.resume();if(p&&typeof p.then==='function')p.then(()=>{if(state.musicOn&&state.musicGain)state.musicGain.gain.setTargetAtTime(state.isSpeaking?0.012:state.musicVolume,state.audioCtx.currentTime,.1);}).catch(()=>{});}catch(_e){}
 }
 if(state.musicOn)startMusic();
} 
function stopMusic(){if(state.musicTimer){clearInterval(state.musicTimer);state.musicTimer=null;}if(state.musicGain&&state.audioCtx)state.musicGain.gain.setTargetAtTime(0,state.audioCtx.currentTime,.08);}
function duckMusic(duck){if(!state.musicGain||!state.audioCtx)return;const val=state.musicOn?(duck?0.012:state.musicVolume):0;state.musicGain.gain.cancelScheduledValues(state.audioCtx.currentTime);state.musicGain.gain.setTargetAtTime(val,state.audioCtx.currentTime,.12);}
function toggleMusic(){state.musicOn=!state.musicOn;if(state.musicOn){initAudio();if(state.audioCtx&&state.musicGain)state.musicGain.gain.setTargetAtTime(state.musicVolume,state.audioCtx.currentTime,.1);startMusic();}else stopMusic();render();}
function playChime(){initAudio();if(!state.audioCtx||!state.musicOn)return;const now=state.audioCtx.currentTime;tone(659.25,.13,.24,'sine',now);tone(783.99,.18,.20,'sine',now+.12);tone(1046.5,.25,.16,'sine',now+.25);}
function playTreasureSound(){
 initAudio();if(!state.audioCtx)return;const now=state.audioCtx.currentTime;
 tone(220,.12,.12,'triangle',now);tone(277.18,.16,.12,'triangle',now+.12);
 tone(329.63,.18,.13,'triangle',now+.28);tone(440,.28,.16,'sine',now+.48);
 tone(659.25,.22,.14,'sine',now+.68);tone(783.99,.25,.14,'sine',now+.84);
 tone(1046.5,.42,.18,'sine',now+1.02);tone(1318.51,.5,.12,'sine',now+1.18);
}
function playCongratulations(){
 initAudio();if(!state.audioCtx)return;const now=state.audioCtx.currentTime;
 tone(523.25,.14,.15,'sine',now);tone(659.25,.14,.15,'sine',now+.14);
 tone(783.99,.24,.17,'sine',now+.28);tone(1046.5,.34,.16,'sine',now+.50);
}

function countHelpOnce(){if(!state.qHelpCounted){state.helpCount[state.level-1]++;state.qHelpCounted=true;}state.qUsedHelp=true;}
function checkGame1(){if(state.questionDone)return;if(state.slots.some(x=>x===null)){state.feedback={type:'try',text:'Pilih kedua-dua suku kata dan letakkan pada ruang dahulu.'};renderGame();return;}
 const w=WORDS[state.qIndex];const actual=state.slots.map(id=>state.shuffledTiles.find(t=>t.id===id)?.text||'');state.qAttempts++;
 if(actual[0]===w.syllables[0]&&actual[1]===w.syllables[1]){
  state.scores[0]++;if(state.qAttempts===1&&!state.qUsedHelp){state.firstTry[0]++;state.bonusStars++;state.streak++;state.bestStreak=Math.max(state.bestStreak,state.streak);}else{state.streak=0;}state.questionDone=true;state.feedback={type:'good',text:`Betul! ${w.syllables[0]} + ${w.syllables[1]} membentuk ${w.word}.`};renderGame();playChime();speakCorrect(w);
 }else{state.errors[0]++;state.streak=0;countHelpOnce();state.feedback={type:'try',text:`Belum tepat. Kesilapan direkodkan (${state.errors[0]}). Kamu boleh cuba lagi. Klik suku kata pada ruang untuk mengeluarkannya, kemudian susun semula.`};renderGame();}
}
function answerChoice(word){if(state.questionDone)return;const target=WORDS[state.qIndex];const idx=state.level-1;state.qAttempts++;
 if(word===target.word){state.scores[idx]++;if(state.qAttempts===1&&!state.qUsedHelp){state.firstTry[idx]++;state.bonusStars++;state.streak++;state.bestStreak=Math.max(state.bestStreak,state.streak);}else{state.streak=0;}state.questionDone=true;state.feedback={type:'good',text:`Betul! ${target.word} sepadan dengan gambar.`};renderGame();playChime();if(state.level===2)speakSequence(['Syabas. Jawapan yang betul.',target.word.toLowerCase()]);else speakSequence(['Hebat. Kamu berjaya.',target.word.toLowerCase()]);}
 else{state.errors[idx]++;state.streak=0;countHelpOnce();state.feedback={type:'try',text:`Belum tepat. Kesilapan direkodkan (${state.errors[idx]}). Baca pilihan sekali lagi dan cuba semula!`};renderGame();}
}
function nextQuestion(){if(!state.questionDone)return;if(state.qIndex<5){state.qIndex++;resetQuestion();renderGame();}else{if(state.level<3){renderScore(state.level);playCongratulations();}else{renderFinal();playTreasureSound();}}}
function restartLevel(level){state.level=level;for(let i=level-1;i<3;i++){state.scores[i]=0;state.firstTry[i]=0;state.helpCount[i]=0;state.errors[i]=0;}state.qIndex=0;resetQuestion();renderInstructions(level);}
function restartAll(){state.scores=[0,0,0];state.firstTry=[0,0,0];state.helpCount=[0,0,0];state.errors=[0,0,0];state.bonusStars=0;state.streak=0;state.bestStreak=0;state.qIndex=0;state.level=1;state.sessionStarted=true;resetQuestion();renderInstructions(1);}
function startSession(){restartAll();startMusic();}
function home(){stopSpeechPlayback();state.sessionStarted=false;renderCover();}
function chooseSyllable(index){
 if(state.questionDone)return;
 const tile=state.shuffledTiles.find(t=>t.index===index);
 if(!tile)return;
 state.slots[index]=tile.id;
 state.selectedTile=null;
 state.feedback=null;
 renderGame();
 speakSequence([`Suku kata ${index===0?'pertama':'kedua'}. ${tile.text}`],{rate:state.rate});
}
function selectTile(id){if(state.questionDone)return;const used=state.slots.includes(id);if(used){state.selectedTile=id;state.feedback={type:'neutral',text:'Kepingan ini sudah berada dalam ruang. Klik ruangnya untuk mengeluarkannya jika mahu menyusun semula.'};}else{state.selectedTile=id;const tile=state.shuffledTiles.find(t=>t.id===id);state.feedback={type:'neutral',text:`Kamu memilih “${tile.text}”. Sekarang klik ruang pertama atau kedua.`};}renderGame();}
function placeSlot(slotIndex,id=null){if(state.questionDone)return;if(id!==null){if(state.slots.includes(id)){state.slots=state.slots.map(v=>v===id?null:v);}state.slots[slotIndex]=id;state.selectedTile=null;state.feedback=null;const placed=state.shuffledTiles.find(t=>t.id===id);renderGame();if(placed)speakSequence([placed.text],{rate:state.rate});return;}
 if(state.selectedTile!==null){const tid=state.selectedTile;const placed=state.shuffledTiles.find(t=>t.id===tid);state.slots=state.slots.map((v,i)=>i!==slotIndex&&v===tid?null:v);state.slots[slotIndex]=tid;state.selectedTile=null;state.feedback=null;renderGame();if(placed)speakSequence([placed.text],{rate:state.rate});}
 else if(state.slots[slotIndex]!==null){state.slots[slotIndex]=null;state.feedback={type:'neutral',text:'Kepingan dikembalikan. Pilih kepingan lain jika mahu.'};renderGame();}
}
function clearSlots(){state.slots=[null,null];state.selectedTile=null;state.feedback=null;renderGame();}
function markAudioHelp(){countHelpOnce();}


/* Pengesahan keluar melalui kekunci Escape; dialog boleh digunakan dengan papan kekunci dan pembaca skrin. */
function closeExitConfirmation(restoreFocus=true){
 const dialog=document.getElementById('exitConfirmDialog');
 if(!dialog)return;
 const previous=dialog._returnFocus;
 dialog.remove();
 if(restoreFocus&&previous&&document.contains(previous))previous.focus();
}
function showExitConfirmation(){
 if(document.getElementById('exitConfirmDialog'))return;
 const previous=document.activeElement;
 const overlay=document.createElement('div');
 overlay.id='exitConfirmDialog';
 overlay.className='exit-confirm-overlay';
 overlay.innerHTML=`<section class="exit-confirm-box" role="alertdialog" aria-modal="true" aria-labelledby="exitConfirmTitle" aria-describedby="exitConfirmDescription" tabindex="-1"><div class="exit-confirm-icon" aria-hidden="true">🚪</div><h2 id="exitConfirmTitle">Kembali ke halaman arahan?</h2><p id="exitConfirmDescription">Adakah kamu mahu meninggalkan soalan pertama dan kembali ke halaman arahan Permainan ${state.level}?</p><div class="exit-confirm-actions"><button type="button" class="exit-confirm-yes" id="exitConfirmYes">Ya</button><button type="button" class="exit-confirm-no" id="exitConfirmNo">Tidak</button></div><p class="exit-confirm-hint">Pilih “Ya” untuk kembali ke halaman arahan permainan ini atau “Tidak” untuk meneruskan soalan. Tekan Escape sekali lagi untuk menutup pengesahan ini.</p></section>`;
 overlay._returnFocus=previous;
 document.body.appendChild(overlay);
 document.getElementById('exitConfirmYes').addEventListener('click',()=>{const level=state.level;closeExitConfirmation(false);stopSpeechPlayback();renderInstructions(level);});
 document.getElementById('exitConfirmNo').addEventListener('click',()=>closeExitConfirmation(true));
 overlay.querySelector('.exit-confirm-box').addEventListener('keydown',e=>{
   if(e.key==='Tab'){
     const buttons=[document.getElementById('exitConfirmYes'),document.getElementById('exitConfirmNo')];
     if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons[1].focus();}
     else if(!e.shiftKey&&document.activeElement===buttons[1]){e.preventDefault();buttons[0].focus();}
   }
 });
 document.getElementById('exitConfirmNo').focus();
}

window.addEventListener('keydown',e=>{
 if(e.altKey||e.ctrlKey||e.metaKey)return;
 if(e.key==='Escape'){
   e.preventDefault();
   if(document.getElementById('exitConfirmDialog')){closeExitConfirmation(true);return;}
   // Escape hanya aktif pada soalan pertama (paparan pertama) setiap permainan.
   // Ia meminta pengesahan sebelum kembali ke halaman arahan bagi permainan semasa.
   if(state.screen==='game' && state.qIndex===0){showExitConfirmation();}
   return;
 }
 const tag=(e.target&&e.target.tagName||'').toLowerCase();
 if(['input','select','textarea'].includes(tag))return;
 if(e.key.toLowerCase()==='m'){
   e.preventDefault();toggleMusic();
 }else if(e.key.toLowerCase()==='a'){
   e.preventDefault();
   if(state.screen==='instructions'){toggleGuidePlayback(state.level);}
   else if(state.screen==='game'){
     if(state.guideIsSpeaking){
       if(window.speechSynthesis&&window.speechSynthesis.paused){window.speechSynthesis.resume();state.guidePaused=false;state.isSpeaking=true;duckMusic(true);}
       else if(window.speechSynthesis){window.speechSynthesis.pause();state.guidePaused=true;state.isSpeaking=false;duckMusic(false);}
     }else{speakGuide(state.level);}
     updateGuidePlaybackButton();
   }
 }
});
app.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
 switch(a){
  case 'start':startSession();break;
  case 'howto':renderHowTo();break;
  case 'backCover':home();break;
  case 'toggleMusic':toggleMusic();break;
  case 'toggleGuide':toggleGuidePlayback(Number(b.dataset.level));break;
  case 'beginLevel':beginLevel(Number(b.dataset.level));startMusic();break;
  case 'hearGuideDuring':speakGuide(state.level);break;
  case 'hearSyllable':markAudioHelp();speakSequence([WORDS[state.qIndex].syllables[Number(b.dataset.index)]],{rate:state.rate});break;
  case 'hearSyllables':markAudioHelp();speakSyllables(WORDS[state.qIndex]);break;
  case 'hearWord':markAudioHelp();speakWord(WORDS[state.qIndex]);break;
  case 'hearGenericHint':markAudioHelp();speakSequence(['Lihat gambar. Baca setiap perkataan dengan perlahan. Cari perkataan yang sesuai dengan gambar.']);break;
  case 'tile':selectTile(b.dataset.id);break;
   case 'chooseSyllable':chooseSyllable(Number(b.dataset.index));break;
  case 'slot':placeSlot(Number(b.dataset.slot));break;
  case 'clearSlots':clearSlots();break;
  case 'checkAnswer':checkGame1();break;
  case 'answerWord':case 'answerPicture':answerChoice(b.dataset.word);break;
  case 'nextQuestion':nextQuestion();break;
  case 'replayLevel':restartLevel(Number(b.dataset.level));break;
  case 'nextLevel':{const l=Number(b.dataset.level);if(l<3)renderInstructions(l+1);else renderFinal();break;}
  case 'restartAll':restartAll();break;
  case 'home':home();break;
 }
});
app.addEventListener('input',e=>{if(e.target.id==='musicVol'){state.musicVolume=Math.max(0,Math.min(.18,Number(e.target.value)/100));if(state.musicGain&&state.audioCtx)state.musicGain.gain.setTargetAtTime(state.musicOn?(state.isSpeaking?0.012:state.musicVolume):0,state.audioCtx.currentTime,.08);}});
app.addEventListener('change',e=>{
 if(e.target.id==='rateSelect'){state.rate=Number(e.target.value)||.8;}
});
app.addEventListener('dragstart',e=>{const tile=e.target.closest('[data-action="tile"]');if(tile&&!state.questionDone){e.dataTransfer.setData('text/plain',tile.dataset.id);e.dataTransfer.effectAllowed='move';}});
app.addEventListener('dragover',e=>{const slot=e.target.closest('[data-drop="true"]');if(slot){e.preventDefault();e.dataTransfer.dropEffect='move';}});
app.addEventListener('drop',e=>{const slot=e.target.closest('[data-drop="true"]');if(slot){e.preventDefault();const id=e.dataTransfer.getData('text/plain');if(id)placeSlot(Number(slot.dataset.slot),id);}});

loadVoices();
if('speechSynthesis' in window){window.speechSynthesis.onvoiceschanged=()=>{const before=state.voiceURI;loadVoices();if(state.screen==='cover'&&before!==state.voiceURI)renderCover();};setTimeout(()=>{const before=state.voiceURI;loadVoices();if(state.screen==='cover'&&before!==state.voiceURI)renderCover();},700);}
renderCover();
// Cuba memulakan muzik sebaik sahaja aplikasi dibuka.
// Pelayar tertentu menyekat bunyi automatik; interaksi pertama akan mengaktifkannya.
unlockAudioAndKeepMusic();
const firstGestureUnlock=()=>unlockAudioAndKeepMusic();
window.addEventListener('pointerdown',firstGestureUnlock,{once:true,passive:true});
window.addEventListener('keydown',firstGestureUnlock,{once:true});
window.addEventListener('touchstart',firstGestureUnlock,{once:true,passive:true});
})();
</script>
</body>
</html>
